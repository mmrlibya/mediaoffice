<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Readex Pro';font-weight:400;src:url(fonts/ReadexPro-Regular.ttf)}
@font-face{font-family:'Readex Pro';font-weight:700;src:url(fonts/ReadexPro-Bold.ttf)}
@font-face{font-family:'Ara';src:url(fonts/ARAHAMAHALFIDAA-REGULAR.TTF)}
html,body{margin:0;height:100%;overflow:hidden;background:#222244;font-family:'Readex Pro';color:#f3f1fb}
body{background:radial-gradient(circle at 50% 40%,#3b3b6a,#2f2f55 55%,#1d1d3d);display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
body:before{content:"";position:absolute;inset:0;background:url(images/grain.png);opacity:.28}
.c{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.stage{position:relative;width:250px;height:250px;display:grid;place-items:center;animation:pop 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.seal{width:200px;height:200px;border-radius:50%;object-fit:cover;position:relative;z-index:2;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 16px rgba(240,200,110,.7)) brightness(1.08)}}
.shine{position:absolute;z-index:3;width:200px;height:200px;border-radius:50%;background:linear-gradient(115deg,transparent 38%,rgba(255,240,190,.9) 50%,transparent 62%);background-size:300% 100%;background-position:130% 0;mix-blend-mode:overlay;animation:sweep 1.4s 1.2s ease-in-out 2 both}
@keyframes sweep{from{background-position:130% 0}to{background-position:-30% 0}}
.ring{position:absolute;border-radius:50%;inset:0}
.r1{border:2px dashed rgba(220,174,95,.75);animation:spin 9s linear infinite}
.r2{inset:-18px;border:3px solid transparent;border-top-color:#f0c66e;border-right-color:rgba(240,198,110,.25);filter:drop-shadow(0 0 8px rgba(240,198,110,.8));animation:spin 3.2s linear infinite reverse}
.r3{inset:-38px;border:1.5px solid rgba(220,174,95,.28);border-left-color:#dcae5f;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{font-family:'Ara','Readex Pro';font-weight:400;color:#dcae5f;font-size:38px;margin:56px 0 6px;animation:up .9s 1s both}
.en{font-size:12.5px;letter-spacing:1.6px;color:#dcae5f;font-weight:700;animation:up .9s 1.2s both}
.t{font-size:23px;font-weight:700;margin-top:30px;line-height:1.7;animation:up .9s 1.6s both}
.s{font-size:14.5px;color:#c6c4e0;margin-top:6px;animation:up .9s 1.9s both}
.flag{direction:ltr;display:flex;width:210px;height:5px;margin-top:28px;animation:up .9s 2.1s both}
.flag i{flex:1}.flag i:nth-child(1){background:#028849}.flag i:nth-child(2){background:#0a0a16}.flag i:nth-child(3){background:#b22a36}
.url{margin-top:30px;direction:ltr;font-weight:700;font-size:27px;color:#2f2f55;background:linear-gradient(#e2b865,#c08f40);padding:10px 32px;box-shadow:0 0 14px rgba(20,20,52,.3);animation:up .9s 2.3s both}
</style></head><body><div class="c">
<div class="stage"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><img class="seal" src="images/ministry-seal.png"><div class="shine"></div></div>
<h1>مكتب الإعلام والتواصل</h1><div class="en">MEDIA AND COMMUNICATION OFFICE</div>
<div class="t" id="t"></div><div class="s" id="s"></div><div class="flag"><i></i><i></i><i></i></div>
<div class="url" id="u" style="display:none">mmr.id.ly</div></div>
<script>
const m=location.search.slice(1);
if(m=="intro"){t.innerHTML="وزارة الثروة البحرية<br>بحكومة الوحدة الوطنية";s.textContent="أخبار الوزارة من مصدرها الرسمي"}
else{t.innerHTML="الموقع الرسمي الجديد<br>لمكتب الإعلام والتواصل";s.textContent="الأخبار · النشاطات · البيانات · طلبات التغطية";u.style.display="block"}
</script></body></html>
